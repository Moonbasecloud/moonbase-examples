version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /event-rsvp
    schedule:
      interval: weekly
    groups:
      event-rsvp-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /express-guestbook
    schedule:
      interval: weekly
    groups:
      express-guestbook-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /nextjs-minimal
    schedule:
      interval: weekly
    groups:
      nextjs-minimal-minor-patch:
        update-types: [minor, patch]
