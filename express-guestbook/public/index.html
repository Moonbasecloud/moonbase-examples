<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guestbook</title>
  <style>
    :root { --ink: #14181f; --muted: #5b6472; --paper: #f5f7fa; --card: #fff; --line: #dfe4ec; --accent: #2f5fd0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); line-height: 1.5; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 30px; }
    .lead { margin: 0 0 24px; color: var(--muted); }
    form, li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; margin-bottom: 12px; }
    textarea { min-height: 88px; resize: vertical; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button[disabled] { opacity: .6; cursor: default; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    #status { min-height: 24px; margin: 12px 0; color: var(--muted); }
    #status.error { color: #b3261e; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .who { font-weight: 600; }
    .when { color: var(--muted); font-size: 13px; margin-left: 8px; }
    .text { margin: 4px 0 0; overflow-wrap: anywhere; }
    footer { margin-top: 32px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Guestbook</h1>
    <p class="lead">Leave a note. It is saved in a PostgreSQL database.</p>

    <form id="form">
      <label for="name">Your name</label>
      <input id="name" name="name" maxlength="40" required autocomplete="name">
      <label for="message">Message</label>
      <textarea id="message" name="message" maxlength="280" required></textarea>
      <button type="submit">Sign the guestbook</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <ul id="entries"></ul>

    <footer>An example app hosted on <a href="https://moonbase.cloud/?utm_source=github&amp;utm_medium=moonbase-examples&amp;utm_campaign=gh-launch">moonbase</a>.</footer>
  </main>

  <script>
    const form = document.getElementById("form");
    const list = document.getElementById("entries");
    const status = document.getElementById("status");

    function say(text, isError) {
      status.textContent = text;
      status.className = isError ? "error" : "";
    }

    // Entries are written with textContent, so a visitor's text is never
    // read as HTML.
    function render(entries) {
      list.replaceChildren(...entries.map((entry) => {
        const item = document.createElement("li");
        const who = document.createElement("span");
        who.className = "who";
        who.textContent = entry.name;
        const when = document.createElement("span");
        when.className = "when";
        when.textContent = new Date(entry.created_at).toLocaleString();
        const text = document.createElement("p");
        text.className = "text";
        text.textContent = entry.message;
        item.append(who, when, text);
        return item;
      }));
      if (entries.length === 0) say("No entries yet. Be the first.");
    }

    async function load() {
      try {
        const response = await fetch("api/entries");
        const body = await response.json();
        if (!response.ok) throw new Error(body.error);
        say("");
        render(body.entries);
      } catch (err) {
        say(err.message || "The guestbook could not be loaded.", true);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const response = await fetch("api/entries", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: form.name.value, message: form.message.value }),
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error);
        form.message.value = "";
        await load();
        say("Saved. Thank you.");
      } catch (err) {
        say(err.message || "The entry could not be saved.", true);
      } finally {
        button.disabled = false;
      }
    });

    load();
  </script>
</body>
</html>
